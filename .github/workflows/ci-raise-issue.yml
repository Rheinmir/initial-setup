# CI đỏ trên nhánh mặc định → tự mở issue mirror (GH#13 hậu quả: skills-sync đỏ 2 ngày,
# 3 commit, không ai biết). Chỉ nhánh mặc định + chỉ event push: đỏ trên nhánh PR là
# việc của người mở PR, không đổ vào ledger chung.
#
# Ledger `llmwiki/wiki/sources/ISSUES.md` vẫn là NGUỒN CHÂN LÝ (xem
# llmwiki/wiki/sources/issue-tracker.md). CI chỉ ghi được vế MIRROR — nó không commit
# vào repo. Người/agent nhận việc mở bằng /fdk và ghi dòng ledger khi claim.
name: ci-raise-issue
on:
  workflow_run:
    workflows: [harness, skills-sync]
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  raise:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WF: ${{ github.event.workflow_run.name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      REPO: ${{ github.repository }}
      BRIEF: llmwiki/wiki/sources/ci-maintainer-brief.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: rút log + LỆNH tái hiện (thứ khiến issue agent làm được, không chỉ đọc được)
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null \
            | sed -e "s/$(printf '\033')\[[0-9;]*m//g" > /tmp/raw.txt || true
          # Neo vào ##[error] cuối: `tail` trần chỉ ra rác dọn dẹp của runner, không ra lỗi.
          # Cùng lượt lần ngược tìm dòng "##[group]Run <cmd>" của CHÍNH step đỏ đó =
          # lệnh tái hiện tại máy. cut/sed bỏ cột job+step+timestamp cho dễ đọc.
          awk -F'\t' '{L[NR]=$0} /##\[error\]/{e=NR}
            END{ if(!e) exit
              split(L[e],p,"\t"); print "STEP=" p[2] > "/tmp/meta.txt"
              for(i=e;i>0;i--){ split(L[i],q,"\t")
                if(q[2]==p[2] && q[3] ~ /##\[group\]Run /){
                  sub(/.*##\[group\]Run /,"",q[3]); print "CMD=" q[3] > "/tmp/meta.txt"; break } }
              s=(e>25?e-24:1); for(i=s;i<=e;i++) print L[i] > "/tmp/cut.txt" }' /tmp/raw.txt
          cut -f3- /tmp/cut.txt 2>/dev/null | sed -E 's/^[0-9T:.Z-]{20,} //' > /tmp/faillog.txt || true
          test -s /tmp/faillog.txt || echo "(không lấy được log — mở $RUN_URL)" > /tmp/faillog.txt
          test -f /tmp/meta.txt || : > /tmp/meta.txt
          echo "STEP=$(sed -n 's/^STEP=//p' /tmp/meta.txt | head -1)" >> "$GITHUB_ENV"
          echo "CMD=$(sed -n 's/^CMD=//p' /tmp/meta.txt | head -1)" >> "$GITHUB_ENV"

      - name: mở issue mirror, hoặc bình luận nếu đã có issue mở cùng workflow
        run: |
          gh label create ci-fail --repo "$REPO" --color B60205 \
            --description "CI đỏ trên nhánh mặc định — mở tự động" 2>/dev/null || true

          TITLE="CI đỏ: $WF trên $BRANCH"
          EXISTING=$(gh issue list --repo "$REPO" --state open --label ci-fail \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          {
            echo "> Issue do CI tự mở. Agent nhận việc: đọc khối \`ci-fail\` rồi làm theo"
            echo "> **Prompt cho agent nhận việc** ở cuối — không cần hỏi thêm ai."
            echo
            echo '```yaml'
            echo "ci-fail:"
            echo "  workflow: $WF"
            echo "  branch: $BRANCH"
            echo "  commit: $SHA"
            echo "  run_url: $RUN_URL"
            echo "  failed_step: ${STEP:-'(không rút được)'}"
            echo "  repro_cmd: ${CMD:-'(không rút được — mở run_url)'}"
            echo "  verify_cmd: python3 fdk/tools/medic.py --ci"
            echo "  ledger: llmwiki/wiki/sources/ISSUES.md"
            echo '```'
            echo
            echo "**Kéo về tái hiện:**"
            echo '```bash'
            echo "git fetch origin && git checkout $SHA"
            echo "${CMD:-# xem $RUN_URL}"
            echo '```'
            echo
            echo "<details><summary>Log bước đỏ — 25 dòng kết ở <code>##[error]</code></summary>"
            echo
            echo '```'
            cat /tmp/faillog.txt
            echo '```'
            echo "</details>"
            echo
            echo "---"
            echo
            sed -n '/<!--BRIEF-->/,$p' "$BRIEF" | tail -n +2
          } > /tmp/body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/body.md
            echo "→ đỏ lại, đã bình luận vào #$EXISTING (không mở issue trùng)"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label ci-fail --label needs-triage --body-file /tmp/body.md
          fi
