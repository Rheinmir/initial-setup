# CI đỏ trên nhánh mặc định → tự mở issue mirror (GH#13 hậu quả: skills-sync đỏ 2 ngày,
# 3 commit, không ai biết). Chỉ nhánh mặc định + chỉ event push: đỏ trên nhánh PR là
# việc của người mở PR, không đổ vào ledger chung.
#
# Ledger `llmwiki/wiki/sources/ISSUES.md` vẫn là NGUỒN CHÂN LÝ (xem
# llmwiki/wiki/sources/issue-tracker.md). CI chỉ ghi được vế MIRROR — nó không commit
# vào repo. Người/agent nhận việc mở bằng /fdk và ghi dòng ledger khi claim.
name: ci-raise-issue
on:
  workflow_run:
    workflows: [harness, skills-sync]
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  raise:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WF: ${{ github.event.workflow_run.name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      REPO: ${{ github.repository }}
    steps:
      - name: gom log bước đỏ (chính thứ người fix cần đọc đầu tiên)
        run: |
          # Neo vào ##[error] cuối: `tail` trần chỉ ra rác dọn dẹp của runner, không ra lỗi.
          # cut/sed bỏ cột job+step+timestamp cho thân issue đọc được.
          gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null \
            | sed -e "s/$(printf '\033')\[[0-9;]*m//g" \
            | awk '{a[NR]=$0} /##\[error\]/{last=NR}
                   END{if(last){s=(last>25?last-24:1); for(i=s;i<=last;i++) print a[i]}}' \
            | cut -f3- | sed -E 's/^[0-9T:.Z-]{20,} //' > /tmp/faillog.txt || true
          test -s /tmp/faillog.txt || echo "(không lấy được log — mở $RUN_URL)" > /tmp/faillog.txt

      - name: mở issue mirror, hoặc bình luận nếu đã có issue mở cùng workflow
        run: |
          gh label create ci-fail --repo "$REPO" --color B60205 \
            --description "CI đỏ trên nhánh mặc định — mở tự động" 2>/dev/null || true

          TITLE="CI đỏ: $WF trên $BRANCH"
          EXISTING=$(gh issue list --repo "$REPO" --state open --label ci-fail \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          {
            echo "| | |"
            echo "|---|---|"
            echo "| workflow | \`$WF\` |"
            echo "| nhánh | \`$BRANCH\` |"
            echo "| commit | ${SHA:0:8} |"
            echo "| run | $RUN_URL |"
            echo
            echo "**Log bước đỏ (25 dòng kết ở ##[error]):**"
            echo '```'
            cat /tmp/faillog.txt
            echo '```'
            echo
            echo "**Kéo về fix:**"
            echo '```bash'
            echo "git fetch origin && git checkout $BRANCH && git pull"
            echo "gh run view $RUN_ID --repo $REPO --log-failed   # log đầy đủ"
            echo '```'
            echo
            echo "Ledger \`llmwiki/wiki/sources/ISSUES.md\` là nguồn chân lý — issue này là"
            echo "MIRROR do CI mở. Người nhận ghi dòng ledger khi claim (\`/fdk\`)."
          } > /tmp/body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/body.md
            echo "→ đỏ lại, đã bình luận vào #$EXISTING (không mở issue trùng)"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label ci-fail --label needs-triage --body-file /tmp/body.md
          fi
