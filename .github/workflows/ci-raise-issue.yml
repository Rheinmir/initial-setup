# CI đỏ trên nhánh mặc định → tự mở issue mirror (GH#13 hậu quả: skills-sync đỏ 2 ngày,
# 3 commit, không ai biết). Chỉ nhánh mặc định + chỉ event push: đỏ trên nhánh PR là
# việc của người mở PR, không đổ vào ledger chung.
#
# Ledger `llmwiki/wiki/sources/ISSUES.md` vẫn là NGUỒN CHÂN LÝ (xem
# llmwiki/wiki/sources/issue-tracker.md). CI chỉ ghi được vế MIRROR — nó không commit
# vào repo. Người/agent nhận việc mở bằng /fdk và ghi dòng ledger khi claim.
name: ci-raise-issue
on:
  workflow_run:
    workflows: [harness, skills-sync]
    types: [completed]

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  raise:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WF: ${{ github.event.workflow_run.name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      REPO: ${{ github.repository }}
      BRIEF: llmwiki/wiki/sources/ci-maintainer-brief.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: cắt log đỏ thành KHỐI CẤU TRÚC (agent đoán ngay, không phải đọc cục log)
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null \
            | python3 harness/scripts/ci-fail-parse.py --repro-out /tmp/repro.sh > /tmp/parsed.txt || true
          awk '/^---LOG---$/{f=1;next} !f{print > "/tmp/meta.yaml"} f{print > "/tmp/faillog.txt"}' \
            /tmp/parsed.txt
          test -s /tmp/meta.yaml || echo '  parsed: false' > /tmp/meta.yaml
          test -s /tmp/faillog.txt || echo "(không lấy được log — mở $RUN_URL)" > /tmp/faillog.txt

      - name: mở issue mirror, hoặc bình luận nếu đã có issue mở cùng workflow
        run: |
          gh label create ci-fail --repo "$REPO" --color B60205 \
            --description "CI đỏ trên nhánh mặc định — mở tự động" 2>/dev/null || true

          TITLE="CI đỏ: $WF trên $BRANCH"
          EXISTING=$(gh issue list --repo "$REPO" --state open --label ci-fail \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          {
            echo "> Issue do CI tự mở. Agent nhận việc: đọc khối \`ci-fail\` rồi làm theo"
            echo "> **Prompt cho agent nhận việc** ở cuối — không cần hỏi thêm ai."
            echo
            echo '```yaml'
            echo "ci-fail:"
            echo "  workflow: \"$WF\""
            echo "  branch: \"$BRANCH\""
            echo "  commit: \"$SHA\""
            echo "  run_url: \"$RUN_URL\""
            cat /tmp/meta.yaml
            echo "  verify_cmd: \"python3 fdk/tools/medic.py --ci\""
            echo "  ledger: \"llmwiki/wiki/sources/ISSUES.md\""
            echo '```'
            echo
            echo "**Kéo về tái hiện:**"
            echo '```bash'
            echo "git fetch origin && git checkout $SHA"
            if [ -s /tmp/repro.sh ]; then cat /tmp/repro.sh; else echo "# không rút được lệnh — mở $RUN_URL"; fi
            echo '```'
            echo
            echo "<details><summary>Log thô — 25 dòng kết ở <code>##[error]</code></summary>"
            echo
            echo '```'
            cat /tmp/faillog.txt
            echo '```'
            echo "</details>"
          } > /tmp/head.md

          # Brief CHỈ nhúng ở issue mới (người mở trên web, không clone, vẫn làm được).
          # Lần đỏ lại chỉ bình luận phần DỮ LIỆU mới + trỏ về file trong repo — dán lại
          # 4KB prompt mỗi lần đỏ là rác, và bản trong repo mới là bản đúng.
          if [ -n "$EXISTING" ]; then
            {
              cat /tmp/head.md
              echo
              echo "> Đỏ lại. Quy trình xử lý không đổi — đọc \`$BRIEF\` trong repo tại"
              echo "> commit trên (hoặc phần *Prompt cho agent nhận việc* ở thân issue)."
            } > /tmp/comment.md
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/comment.md
            echo "→ đỏ lại, đã bình luận vào #$EXISTING (không mở issue trùng, không dán lại brief)"
          else
            {
              cat /tmp/head.md
              echo
              echo "---"
              echo
              sed -n '/<!--BRIEF-->/,$p' "$BRIEF" | tail -n +2
              echo
              echo "<sub>Nguồn của phần trên: \`$BRIEF\` trong repo. Nếu hai bên lệch,"
              echo "bản trong repo tại commit đang xử lý là bản đúng.</sub>"
            } > /tmp/body.md
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label ci-fail --label needs-triage --body-file /tmp/body.md
          fi
