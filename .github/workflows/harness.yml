name: harness

# Sàn đảm bảo của harness — chạy trên MỌI PR và push lên orca, KHÔNG phụ thuộc
# vendor/hook nào (advisory rules bị lờ ở mọi agent non-Claude → CI là nơi nói "không"
# mà không bypass được khi merge). Cả hai job đều gọi CÙNG một lõi llmwiki-validate.py.

on:
  pull_request:
  push:
    branches: [orca]

permissions:
  contents: read

jobs:
  selftest:
    name: self-test lõi (demo 13 + broad 80 = 93 assertion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: demo.sh (13 assertion)
        run: bash harness/poc-vendor-neutral/demo.sh
      - name: test-broad.sh (54 assertion)
        run: bash harness/poc-vendor-neutral/test-broad.sh
      - name: wiki-graph user-reachability (chặn AP-1 dev-only trap)
        run: bash harness/tests/wiki-graph-user-reachability-test.sh .
      - name: memory-map user-reachability (bộ-nhớ-thứ-cấp tự chạy downstream)
        run: bash harness/tests/memory-map-user-reachability-test.sh .

  validate-content:
    name: validate file .md đổi (layer=repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: harness validator trên file .md thay đổi
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # base có thể rỗng / không tồn tại (push đầu, force) → lùi về HEAD~1
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          files=$(git diff --name-only "$base" HEAD | grep -E '\.md$' || true)
          if [ -z "$files" ]; then echo "không có .md đổi — bỏ qua"; exit 0; fi
          echo "kiểm tra:"; echo "$files" | sed 's/^/  /'
          # shellcheck disable=SC2086
          python3 harness/poc-vendor-neutral/bin/llmwiki-validate.py files $files

  repo-health:
    name: repo health (fresh-clone gates — trước nay chỉ pre-commit, bypass được)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      # Các validator này trước nay CHỈ chạy pre-commit (bypass bằng --no-verify / không cài).
      # Nay git-aware (bỏ qua draft/html gitignored) nên chạy được trên checkout sạch của CI.
      - name: R3 index-sync (git-aware) — framework wiki (fdk/wiki) + demo template (llmwiki/wiki)
        run: |
          python3 harness/validators/index_sync.py --wiki-dir fdk/wiki
          python3 harness/validators/index_sync.py --wiki-dir llmwiki/wiki
      - name: L4 wiki-health — broken wikilink (git-aware)
        run: python3 harness/scripts/wiki-health.py --wiki-dir fdk/wiki --fail-on broken
      - name: arch-scan — doc vs rule
        run: python3 harness/scripts/arch-scan.py --root .
      - name: retrieval-eval — query truy-hồi không tụt dưới sàn (tất định, không LLM)
        run: |
          # 1. goldens coherent (mỗi golden tự thoả expected_pages) + cap 30 còn giữ
          python3 harness/scripts/retrieval-eval.py --self-test
          # 2. chiến lược query (proxy L1 tất định) không hồi quy hit@k / phình token so baseline L0 đã commit
          python3 harness/scripts/query-proxy.py --mode L1 --topn 5 --out "$RUNNER_TEMP/retrieval-L1.json"
          python3 harness/scripts/retrieval-eval.py --outputs "$RUNNER_TEMP/retrieval-L1.json" --check
      - name: code-health — Trụ 4 cổng CI tất định không-LLM (mọi .py compile; ruff nếu có)
        run: |
          pip install ruff --quiet || echo "ruff không cài được — chạy floor compile"
          python3 harness/validators/code_health.py --root .
      - name: harness-lint — meta-drift (hằng số content-dir + wiring policy→settings)
        run: python3 harness/scripts/harness-lint.py --check
      - name: agent↔claude skill-table parity
        run: python3 harness/validators/agent_claude_parity.py
      - name: duplicate-basename — slug wiki không trùng giữa các thư mục
        run: python3 harness/validators/duplicate_basename.py --wiki-dir fdk/wiki
      - name: ADR first-class trong khuôn per-project (skeleton + functional)
        run: bash harness/tests/adr-normal-user-test.sh .
      - name: auto-index khi wiki đổi + force-query grounding khi propose
        run: bash harness/tests/auto-index-and-grounding-test.sh .
      - name: R13 decision→ADR gate (link + edit/delete-when-superseded)
        run: bash harness/tests/decision-adr-gate-test.sh .
      - name: T5 policy↔converters drift (adapter khớp rule) — dời từ pre-commit (issue #18)
        run: bash harness/tests/policy-converters-drift-test.sh
      - name: harness-local — rule RIÊNG dự án (P-namespace, sync-safe, không giẫm R)
        run: bash harness/tests/harness-local-test.sh .
      - name: R14 patterns-protected — kho pattern chỉ sửa khi user cho phép (unlock env)
        run: bash harness/tests/patterns-guard-test.sh .
      - name: U11 self-integrity — stamp repo ↔ global version-skew (GH#63 Phase 5)
        run: bash harness/tests/harness-integrity-test.sh .
      - name: flywheel auto-capture — rule cắn tự vào ledger (capture không chờ ai nhớ gõ)
        run: bash harness/tests/flywheel-autocapture-test.sh .
      - name: install ref-override — canary không được chấm nhầm bản cũ (UAT mù engine)
        run: bash harness/tests/install-ref-override-test.sh .
      - name: downstream fire-drill — CI downstream tự chứng rule gốc còn cắn (đúng cách)
        run: bash harness/tests/downstream-firedrill-test.sh .
      - name: capproof — checklist năng lực tự soi còn cắn (nợ mới đỏ, nợ tồn đếm)
        run: bash harness/tests/capproof-test.sh .
      - name: ledger-snapshot — ký ức máy-local round-trip + backup tự chạy
        run: bash harness/tests/ledger-snapshot-test.sh .
      - name: skill-provenance-scope — tamper skill NGOÀI đỏ, dev churn local không cries-wolf
        run: bash harness/tests/skill-provenance-scope-test.sh .
      - name: engines-smoke — chạy THẬT từng engine từng thiếu proof (26 nợ capproof → 0)
        run: bash harness/tests/engines-smoke-test.sh .
      - name: hook-guard-invariant — self-test không được commit trần (GH#30, chặn đệ quy hook)
        run: bash harness/tests/hook-guard-invariant-test.sh .
      - name: wiki-sync — neo code→wiki (no-op gate 0-token)
        run: bash harness/tests/wiki-sync-test.sh .
      - name: docs-skill-okf — skill tạo wiki .md phải xuất chuẩn OKF v0.1 (R9)
        run: bash harness/tests/docs-skill-okf-test.sh .
      - name: harness-update — T1-T4 cài/refresh trong repo tạm cô lập
        run: bash harness/tests/harness-update-test.sh .
      - name: openclaude-install — detect/merge/idempotency trong HOME cô lập
        run: bash harness/tests/openclaude-install-test.sh .
      - name: orca-guard fail-open — hook thiếu file không được brick tool (cozyroom)
        run: bash harness/tests/orca-guard-failopen-test.sh .
      - name: r12-v3-workspace — sweep subrepo behind (T5)
        run: bash harness/tests/r12-v3-workspace-test.sh .
      - name: dep-health-gate — TỒN TẠI ≠ DÙNG ĐƯỢC (chặn hồi quy code-graph 0-byte/thiếu schema)
        run: bash harness/tests/dep-health-gate-test.sh .
      - name: ge-acceptance — TT_X nghiệm thu 7 mắt xích PDF Graph Engineering bằng lệnh thật
        run: bash harness/tests/ge-acceptance-test.sh .
      - name: ge-backcompat — dữ liệu/lệnh CŨ vẫn chạy sau T1–T7 (đọc JSONL/provenance/mermaid cũ)
        run: bash harness/tests/ge-backcompat-test.sh .
      - name: ge-integration — T1/T2/T4/T7 nói chuyện được với nhau trên một dòng công việc thật
        run: bash harness/tests/ge-integration-test.sh .
      - name: ge-killswitch — commit-DAG hub (T7) tắt được · xoá được · gỡ được
        run: bash harness/tests/ge-killswitch-test.sh .
      - name: ge-purpose — TT8 từng thay đổi T1–T7 có làm ĐÚNG VIỆC nó sinh ra để làm không
        run: bash harness/tests/ge-purpose-test.sh .
      - name: ge-reachability — TT5 năng lực mới tới tay agent + không tụt baseline
        run: bash harness/tests/ge-reachability-test.sh .
      - name: ge-travel — thay đổi mới có tới tay người dùng mới qua đường cài thật không
        run: bash harness/tests/ge-travel-test.sh .
      - name: wiki-sync-flags-failopen — cờ code-drift tới /query, mọi trạng thái hỏng fail-open
        run: bash harness/tests/wiki-sync-flags-failopen-test.sh .
      - name: wikigraph-single-source — wiki-graph.py và build-wiki-graph.py không được lệch cạnh
        run: bash harness/tests/wikigraph-single-source-test.sh .
      - name: scope-config — .overstack.yaml (wiki_dir + code_root) một nguồn cho mọi hook, GH#49
        run: bash harness/tests/scope-config-test.sh .
      - name: stop-hook-all-wikis — Stop auto-index + R3 soi MỌI wiki (fdk/wiki + llmwiki/wiki), GH#76
        run: bash harness/tests/stop-hook-all-wikis-test.sh .
      - name: evidence-terminal — R19 chuỗi kết luận phải chạm chứng cứ + kill-switch
        run: bash harness/tests/evidence-terminal-test.sh .
      - name: anti-idle — provider cắt lượt bằng refusal rỗng thì Stop hook chặn dừng
        run: bash harness/tests/anti-idle-stop-test.sh .
      - name: token-attrib — quy trách nhiệm token theo nguồn bơm (khuếch đại token·lượt)
        run: bash harness/tests/token-attrib-test.sh .
      - name: dot-layout-migrate — installer migrate llmwiki/→.llmwiki/ + harness/→.harness/ (downstream)
        run: bash harness/tests/dot-layout-migrate-test.sh .
      - name: tests-wired — MỌI harness/tests/*-test.sh phải có step trong workflow này
        run: |
          for t in harness/tests/*-test.sh; do
            grep -q "$(basename "$t")" .github/workflows/harness.yml \
              || { echo "chưa wire vào CI: $t"; exit 1; }
          done
      - name: harness-doctor — fire-drill (mọi rail còn cắn?)
        run: python3 harness/scripts/harness-doctor.py --ci
      - name: capabilities current (fdk/CAPABILITIES.md khớp đĩa)
        run: python3 fdk/tools/build-capabilities.py --check
      - name: adapt-registry leak-gate (ẩn số quarantine không rò — BNAL Step 7)
        run: python3 harness/scripts/adapt-registry.py --check
