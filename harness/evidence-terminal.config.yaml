# evidence-terminal (R19) — moi duong di tu ket luan xuong la phai ket thuc o nut CHUNG CU.
# Engine: harness/validators/evidence_terminal.py + harness/validators/evidence_leaf.py
# Concept: llmwiki/wiki/concepts/evidence-terminal-chain.md

enabled: true                     # cong tac TANG BEN (theo repo, commit duoc, ca team dung chung).
                                  # false = tat han luat nay.
                                  # Uu tien tu HEP toi RONG:
                                  #   co --no-evidence-chain
                                  #   > env OVERSTACK_EVIDENCE_TERMINAL (0/false/off)
                                  #   > khoa `enabled` nay
                                  # Tat o BAT KY tang nao van IN mot dong len stderr noi ro tang
                                  # nao da tat — co che im lang luc chet se bi nham la dang song.

mode: strict                      # strict = chuoi hong CHAN that (exit 2). advisory = chi canh bao.
                                  # MOT knob cho MOT quyet dinh — ban dau tach doi (strictness +
                                  # verified) la thua, va ten `strictness` va cham voi adapter
                                  # claim-receipts (leak-gate bat dung: mot hang so, mot nha).
                                  #
                                  # DO TRUOC KHI LAT sang strict (2026-08-03), khong lat mu:
                                  #   217 file .md trong llmwiki/wiki, 2 file co khoi evidence-chain,
                                  #   2/2 bi bat — ca hai la tai lieu DAY chinh dinh dang nay, ref vi du
                                  #   co y khong ton tai. Mot LOP bao oan, khong phai hai ca le, nen sua
                                  #   bang ngoai le `r19_meta: true` (cung khuon r7_meta) -> bao oan 0/2.

