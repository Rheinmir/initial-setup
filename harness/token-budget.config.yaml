# harness/token-budget.config.yaml
# THE single place the TokenBudget unknowns live — the /build-now-adapt-later quarantine.
# token-budget.py reads its per-model $ rates + budget caps + enforce mode FROM HERE. Trend
# mirrored (2026): AI FinOps — "3x over the 2026 token budget by April"; no agent framework
# ships a native dollar budget cap, so per-action/per-session enforcement must be built.
#
# Counting tokens by code, summing per session/task, and computing $ from rates are deterministic
# and built now (--self-test). The actual rates (change per provider/model) and the budget caps
# (a stakeholder/FinOps decision) are the unknowns.

verified: false                   # ASSUMPTION (not verified) — rates are illustrative provider numbers (drift constantly); caps are un-calibrated guesses; mode stays 'warn' so an un-tuned cap never kills a session.

mode: warn                        # ASSUMPTION (not verified) — warn (advise, exit 0) until caps tuned; then 'block' (exit 2 over cap)

budgets:
  per_session_tokens: 2000000     # ASSUMPTION (not verified) — 2M tokens/session is a guess
  per_task_usd: 5.0               # ASSUMPTION (not verified) — $5/task cap is a guess
  # Complexity budget (PDF §VIII.B): every run declares max model calls / sub-agents / concurrent
  # workers / graph writes. Counted per session from the `record --calls/--subagents/--workers/--graph-writes` flags.
  per_session_model_calls: 500    # ASSUMPTION (not verified) — 500 model calls/session is a guess
  per_workflow_subagents: 16      # ASSUMPTION (not verified) — 16 sub-agents/workflow is a guess
  max_concurrent_workers: 8       # ASSUMPTION (not verified) — 8 concurrent workers is a guess
  per_session_graph_writes: 200   # ASSUMPTION (not verified)
  per_session_tool_calls: 2000    # ASSUMPTION (not verified) — spec §5 max tool calls
  min_evidence: 0                 # SÀN dưới (spec §5): 0 = tắt; >0 ép verdict chốt phải có N bằng chứng   # ASSUMPTION (not verified) — 200 graph writes/session is a guess

# "Continue in new session" TỰ ĐỘNG (harness/scripts/session-continue.py, hook UserPromptSubmit):
# vượt HOẶC đoán sẽ vượt (current + 1 lượt trung bình ≥ cap, hay ≥ threshold) một trong
# per_session_tokens / per_task_usd / per_session_model_calls → chặn prompt, ghi bàn giao
# <overstack>/handover/DDMMYY-<sid>-continue.md (cấu trúc như Orca "Continue in new session"),
# mở terminal mới cùng worktree với cùng agent qua `orca` (không có orca → in lệnh chạy tay).
# Đây là chỗ DUY NHẤT trần được thi hành — `mode: block` phía trên chỉ ảnh hưởng lệnh `check` tay.
auto_handover:
  enabled: true
  threshold: 0.85                 # ASSUMPTION (not verified) — 85% là ngưỡng "sắp vượt" đoán
  agent: auto                     # auto | claude | openclaude
  triggers: [per_session_tokens, per_session_model_calls]   # per_task_usd KHÔNG mặc định: gói subscription không tính tiền theo token, $ chỉ là số quy đổi — thêm vào đây nếu trả theo token

# $ per 1K tokens. Provider numbers drift — treat as a guess, reconcile against real billing.
rates:                            # ASSUMPTION (not verified) — illustrative; update from the provider price page
  default:  {input: 0.003,  output: 0.015}
  opus:     {input: 0.015,  output: 0.075}
  sonnet:   {input: 0.003,  output: 0.015}
  haiku:    {input: 0.0008, output: 0.004}

# ADAPT-CHECKLIST (finalize when real billing data exists):
#   1. Reconcile rates against the provider's CURRENT price page (per model).
#   2. Calibrate budgets (tokens, $, model calls, sub-agents, workers, graph writes) against real
#      workloads + FinOps targets.
#   3. Run: python3 harness/scripts/token-budget.py --self-test  (must PASS).
#   4. Flip mode: block AND verified: true. Only then does exceeding a cap actually block.
